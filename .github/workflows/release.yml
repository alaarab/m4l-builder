name: Release

# Publishing a GitHub release uploads that tag's build to PyPI with trusted
# publishing (OIDC), so no PyPI token is stored here. The PyPI project lists
# this workflow (release.yml) and the `pypi` environment as its publisher.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG doesn't match the pyproject version ($version); expected v$version."
            exit 1
          fi
      - name: Build sdist and wheel
        run: uv build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/m4l-builder/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
