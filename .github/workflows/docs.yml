name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, linuxbox]
    steps:
      - uses: actions/checkout@v7
      # actions/setup-python cannot resolve a prebuilt Python on the Arch
      # linuxbox runner (omarchy); use uv instead and run mkdocs from an
      # ephemeral tool environment.
      - uses: astral-sh/setup-uv@v7
      - name: Build site
        run: uv tool run --with mkdocs-material mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
