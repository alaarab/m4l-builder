name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# The self-hosted runner's /tmp is a quota-limited tmpfs. Native C++ tests
# need disk-backed compiler scratch space, including sanitizer builds.
jobs:
  lint:
    name: lint & type-check
    runs-on: [self-hosted, linuxbox]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use disk-backed scratch space
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync dev dependencies
        run: uv sync --locked --group dev
      - name: Ruff
        run: uv run ruff check src tests
      - name: Mypy
        run: uv run mypy

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: [self-hosted, linuxbox]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use disk-backed scratch space
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync dev dependencies
        run: uv sync --locked --group dev
      - name: Build package
        run: uv build
      - name: Pytest
        run: uv run pytest --cov=m4l_builder --cov-report=term-missing
