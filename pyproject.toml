[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "m4l-builder"
version = "0.8.0"
description = "Programmatically build Max for Live (.amxd) devices"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Ala Arab" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.scripts]
m4l = "m4l_builder.cli:main"

[project.urls]
Homepage = "https://github.com/alaarab/m4l-builder"
Repository = "https://github.com/alaarab/m4l-builder"

[tool.hatch.build]
exclude = ["tests/"]

[tool.hatch.build.targets.wheel]
packages = ["src/m4l_builder"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "mypy>=2.4.0",
]
docs = [
    "mkdocs-material>=9.7.7",
    # Keep a security floor for the transitive b64 extension dependency.
    "pymdown-extensions>=12.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["m4l_builder"]
branch = true

[tool.coverage.report]
show_missing = true
# Measured 87% (branch) at the time this gate was added; 85 leaves headroom
# for matrix variance (version-gated shims, platform branches). If a matrix
# leg ever flakes near the line, move this to a single-version CLI flag.
fail_under = 85

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E501 (line length) is deferred: the codebase has many long generated DSP/JS
# string literals. UP031 (printf -> str.format) is deferred too -- the rewrites
# are behavior-sensitive (%-with-tuple semantics) and not worth the risk here.
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E501", "UP031"]

[tool.ruff.lint.per-file-ignores]
# Facade modules deliberately re-export names to form the public API surface;
# the unused-import / star-import warnings there are intentional.
"src/m4l_builder/authoring.py" = ["F401", "F403"]
"src/m4l_builder/bridge.py" = ["F401", "F403"]
"src/m4l_builder/live.py" = ["F401", "F403"]
"src/m4l_builder/bridge_api.py" = ["F401"]
# recipes.py is now a thin facade re-exporting the recipes_*.py implementation
# modules so `from m4l_builder.recipes import X` keeps working after the split.
"src/m4l_builder/recipes.py" = ["F401", "F403"]
# Single-letter loop / unpack vars (e.g. `l`) are idiomatic in the test suite.
"tests/**" = ["E741"]

[tool.mypy]
python_version = "3.10"
files = ["src/m4l_builder"]
ignore_missing_imports = true
implicit_optional = false


